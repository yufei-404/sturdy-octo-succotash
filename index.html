<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄博妙妙屋 · BOBO解谜</title>
<style>
  :root{
    --bg:#15100c; --panel:#241b15; --panel2:#2e231b;
    --wall:#3a2d24; --wall2:#2c211a; --floor:#4a3627; --floor2:#33261a;
    --wood:#5d4330; --wood2:#4b3523; --accent:#2a4a4a; --accent2:#1f3838;
    --gold:#f0c060; --gold2:#ffd36b; --ink:#e9ddc7; --dim:#b3a58f;
    --danger:#ff5a3c; --good:#7fd07f; --blue:#8fb8ff;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #2a2019 0%, #120d0a 55%, #0a0705 100%);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:12px;
    user-select:none;
  }
  #game{
    width:min(980px,100%);
    background:var(--panel);
    border:1px solid #000;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(240,192,96,.08);
  }
  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    background:linear-gradient(180deg,#2e231b,#241b15);
    border-bottom:1px solid #000;
  }
  #logo{font-size:18px;font-weight:700;letter-spacing:1px;color:var(--gold);white-space:nowrap;}
  #roomName{font-size:14px;color:var(--dim);}
  #treasureCount{font-size:13px;color:var(--gold2);margin-left:auto;white-space:nowrap;}
  .topbtn{
    background:var(--panel2);color:var(--ink);border:1px solid #4a3b2e;
    border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .topbtn:hover{background:#3a2d24;color:#fff;}
  /* ---------- scene ---------- */
  #sceneWrap{position:relative;background:#000;}
  svg#scene{display:block;width:100%;height:auto;background:#17100b;}
  .hs{cursor:pointer;}
  .hs .obj{transition:filter .18s ease, transform .18s ease; transform-box:fill-box; transform-origin:center;}
  .hs:hover .obj{filter:brightness(1.5) drop-shadow(0 0 7px var(--gold2));}
  .hs.clickable{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.92;}50%{opacity:.62;}}
  .navbtn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:42px;height:64px;border:1px solid #3a2d24;border-radius:10px;
    background:rgba(24,18,12,.82);color:var(--gold);font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:5;
  }
  .navbtn:hover{background:rgba(58,45,36,.95);}
  .navbtn.left{left:8px;} .navbtn.right{right:8px;} .navbtn.up{left:50%;top:10px;transform:translateX(-50%);width:64px;height:38px;}
  .navbtn.down{left:50%;top:auto;bottom:10px;transform:translateX(-50%);width:64px;height:38px;}
  /* ---------- message banner ---------- */
  #msg{
    position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
    max-width:88%;padding:10px 16px;border-radius:10px;text-align:center;font-size:15px;line-height:1.55;
    background:rgba(20,14,9,.92);border:1px solid rgba(240,192,96,.35);
    color:var(--ink);box-shadow:var(--shadow);z-index:9;opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  #msg.show{opacity:1;}
  #msg.warn{border-color:var(--danger);color:#ffd9d0;}
  #msg.good{border-color:var(--good);color:#d8ffd8;}
  /* ---------- inventory ---------- */
  #invBar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 14px;background:linear-gradient(0deg,#1d1610,#241b15);
    border-top:1px solid #000;min-height:66px;
  }
  #invLabel{font-size:12px;color:var(--dim);writing-mode:vertical-lr;letter-spacing:2px;}
  .slot{
    position:relative;width:58px;height:52px;border-radius:9px;
    background:#2b211a;border:1px solid #453526;display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;transition:.15s;
  }
  .slot .ico{font-size:22px;line-height:1;}
  .slot .ico img{width:34px;height:34px;object-fit:contain;border-radius:4px;}
  .slot .nm{font-size:9px;color:var(--dim);margin-top:2px;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .slot:hover{border-color:var(--gold);}
  .slot.selected{border-color:var(--gold2);background:#3a2d22;box-shadow:0 0 10px rgba(240,192,96,.5);}
  .slot.empty{opacity:.35;cursor:default;}
  .slot.treasure .nm{color:var(--gold2);}
  /* ---------- modal ---------- */
  #modal{
    position:fixed;inset:0;background:rgba(8,5,3,.86);display:none;
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  #modal.open{display:flex;}
  .card{
    width:min(560px,100%);max-height:92vh;overflow:auto;
    background:linear-gradient(180deg,#2e231b,#1f1710);
    border:1px solid #4a3b2e;border-radius:16px;padding:26px 28px;
    box-shadow:0 20px 70px rgba(0,0,0,.8);text-align:center;
  }
  .card h1{color:var(--gold);margin:0 0 6px;font-size:30px;letter-spacing:3px;}
  .card h2{color:var(--gold2);margin:0 0 14px;font-size:20px;font-weight:600;}
  .card p{color:var(--dim);line-height:1.8;font-size:15px;margin:10px 0;}
  .card .story{color:var(--ink);text-align:left;background:#17100b;border-radius:10px;padding:16px;line-height:2;font-size:14px;}
  .bigbtn{
    margin-top:16px;display:inline-block;background:linear-gradient(180deg,#7a5a2e,#5d4320);
    color:#fff;border:1px solid #a97f3d;border-radius:10px;padding:12px 30px;
    font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:inherit;
  }
  .bigbtn:hover{filter:brightness(1.15);}
  .bigbtn.gold{background:linear-gradient(180deg,#e0a63c,#b57f22);border-color:#ffd36b;color:#3a2400;}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  /* code pad */
  .codeSlots{display:flex;gap:14px;justify-content:center;margin:20px 0;}
  .codeSlot{width:64px;height:72px;border-radius:10px;background:#17100b;border:2px solid #4a3b2e;
    display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:var(--gold);}
  .keypad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin-top:8px;}
  .key{height:52px;border-radius:10px;background:#2b211a;border:1px solid #453526;color:var(--ink);
    font-size:20px;cursor:pointer;font-family:inherit;}
  .key:hover{background:#3a2d22;}
  .key.wide{grid-column:span 2;}
  .hint{color:var(--dim);font-size:13px;margin-top:12px;}
  /* 配制积液窗口 */
  .mixSlots{display:flex;gap:14px;justify-content:center;margin:20px 0 14px;}
  .mixSlot{width:72px;height:72px;border-radius:12px;background:#17100b;border:2px dashed #4a3b2e;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#6f5f4a;font-weight:700;}
  .mixSlot.filled{border-style:solid;border-color:var(--gold);color:var(--gold);font-size:34px;}
  .mixIng{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
  .mixIngBtn{background:#2b211a;border:1px solid #453526;border-radius:10px;color:var(--ink);
    padding:10px 16px;font-size:15px;cursor:pointer;font-family:inherit;}
  .mixIngBtn:hover{border-color:var(--gold);background:#3a2d22;}
  .mixIngBtn:disabled{opacity:.32;cursor:not-allowed;}
  #thiefBtn.active{background:#7a2e24;border-color:#ff7a5c;color:#ffd9d0;}
  /* dog overlay —— 更有张力的突袭 */
  #dogOverlay{
    position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:radial-gradient(700px 480px at 50% 50%, rgba(255,50,25,.55), rgba(120,6,0,.82));
    overflow:hidden;pointer-events:none;
  }
  #dogOverlay.show{display:flex;animation:shk .32s ease-in-out infinite;}
  #dogFlash{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,40,20,0), rgba(255,40,20,.55));mix-blend-mode:screen;animation:fl .18s steps(2) infinite;pointer-events:none;}
  .bolt{position:absolute;font-size:150px;color:#fff;opacity:0;text-shadow:0 0 30px #ffe066,0 0 60px #ffb020;pointer-events:none;}
  .bolt.bl{left:6%;top:4%;transform:rotate(-18deg);}
  .bolt.br{right:6%;bottom:6%;transform:rotate(14deg);}
  .bolt.bc{left:50%;top:18%;transform:translateX(-50%) rotate(4deg);}
  #dogOverlay.show .bolt{animation:boltflash .5s ease-in-out infinite;}
  .bolt.br{animation-delay:.28s;}
  .bolt.bc{animation-delay:.14s;}
  @keyframes boltflash{0%,40%,100%{opacity:0;}46%{opacity:1;}60%{opacity:.2;}70%{opacity:.95;}}
  #dogChaser{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);pointer-events:none;}
  #dogChaser img{width:240px;height:450px;object-fit:contain;filter:drop-shadow(0 0 34px #ff5a3c) drop-shadow(0 0 90px rgba(255,42,26,.55));animation:chaserun .5s ease-in-out infinite;}
  @keyframes chaserun{0%,100%{transform:translateX(-16px) rotate(-4deg);}50%{transform:translateX(16px) rotate(4deg);}}
  #chaseBar{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:12px;z-index:30;pointer-events:none;
    background:rgba(110,8,0,.92);border:2px solid #ff5a3c;border-radius:12px;
    padding:8px 20px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;
    box-shadow:0 0 26px rgba(255,60,30,.85);animation:pulse .9s ease-in-out infinite;
  }
  #chaseBar.show{display:flex;}
  #chaseTimer{font-size:28px;color:#ffe066;min-width:32px;text-align:center;}
  .shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:translate(0,0);}20%{transform:translate(-12px,5px);}40%{transform:translate(11px,-6px);}60%{transform:translate(-9px,-5px);}80%{transform:translate(8px,6px);}}
  .flash{animation:fl .35s;}
  @keyframes fl{0%{filter:brightness(1);}50%{filter:brightness(2.8) saturate(.15);}100%{filter:brightness(1);}}
  /* 主角黄博 */
  .player{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:idle 3.4s ease-in-out infinite;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
  }
  @keyframes idle{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  /* 闪电狗图片 */
  #dogEmoji img{width:190px;height:190px;object-fit:contain;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.7);}
  /* 开始界面 */
  #startScreen{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% 26%, #2e231b 0%, #14100c 55%, #080605 100%);padding:20px;}
  #startScreen.hidden{display:none;}
  .startInner{width:min(1120px,100%);display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:28px;align-items:center;}
  .startTitle{color:var(--gold);text-align:left;min-width:0;}
  .startTitle .stBig{font-size:56px;font-weight:800;letter-spacing:8px;line-height:1.06;text-shadow:0 5px 22px rgba(0,0,0,.65);}
  .startTitle .stTag{font-size:14px;color:var(--dim);margin-top:16px;letter-spacing:3px;}
  .startVs{display:flex;align-items:center;justify-content:center;gap:12px;}
  .charCard{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .charCard .ph{width:176px;height:240px;border-radius:18px;overflow:hidden;background:#241b15;border:2px solid rgba(240,192,96,.35);box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;}
  .charCard .ph img{width:100%;height:100%;object-fit:contain;}
  .charCard.dog .ph img{transform:scaleX(-1);}
  .charCard span{font-size:15px;color:var(--ink);letter-spacing:2px;}
  .vsMark{font-size:44px;color:var(--gold2);text-shadow:0 0 22px rgba(255,90,60,.85);animation:pulse 1.2s ease-in-out infinite;}
  .startMenu{display:flex;flex-direction:column;gap:14px;align-items:stretch;}
  .startBtn{font-family:inherit;font-size:18px;font-weight:700;letter-spacing:3px;padding:15px 20px;border-radius:12px;cursor:pointer;border:1px solid #4a3b2e;background:linear-gradient(180deg,#3a2d24,#241b15);color:var(--ink);transition:.15s;}
  .startBtn:hover{filter:brightness(1.2);border-color:var(--gold);}
  .startBtn.gold{background:linear-gradient(180deg,#e0a63c,#b57f22);border-color:#ffd36b;color:#3a2400;}
  .startBtn.disabled{opacity:.4;cursor:not-allowed;filter:none;}
  /* 战斗界面 */
  #battle{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(1100px 800px at 50% 40%, #3a2a1a 0%, #120c06 60%, #070402 100%);padding:24px;}
  #battle.show{display:flex;}
  .btTop{font-size:30px;font-weight:800;letter-spacing:6px;color:#ffe066;text-shadow:0 0 24px rgba(255,90,60,.8);}
  .btStage{display:flex;align-items:center;gap:40px;}
  .fighter{display:flex;flex-direction:column;align-items:center;gap:10px;width:190px;}
  .fighter .fimg{width:180px;height:240px;border-radius:16px;overflow:hidden;background:#241b15;border:2px solid rgba(240,192,96,.35);box-shadow:0 12px 34px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;}
  .fighter .fimg img{width:100%;height:100%;object-fit:contain;}
  .fighter.dog .fimg img{transform:scaleX(-1);}
  .fname{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:2px;}
  .hpbar{width:100%;height:16px;border-radius:8px;background:#2b211a;border:1px solid #4a3b2e;overflow:hidden;}
  .hpfill{height:100%;width:100%;background:linear-gradient(180deg,#7fd07f,#3f9d3f);transition:width .3s;}
  .hpfill.dog{background:linear-gradient(180deg,#ff8a6a,#d8482c);}
  .hptxt{font-size:12px;color:var(--dim);}
  .btVs{font-size:44px;color:#ffe066;text-shadow:0 0 22px rgba(255,90,60,.9);}
  #btLog{width:min(640px,100%);min-height:58px;max-height:96px;overflow:auto;background:rgba(20,14,9,.8);border:1px solid rgba(240,192,96,.25);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink);line-height:1.7;}
  .btRow{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;justify-content:center;width:min(720px,100%);}
  #btItems{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;flex:1;}
  .btItem{display:flex;flex-direction:column;align-items:center;gap:4px;background:#2b211a;border:1px solid #453526;border-radius:10px;padding:8px 10px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .btItem:hover{border-color:var(--gold);background:#3a2d22;}
  .btItem img{width:42px;height:42px;object-fit:contain;}
  .btItem span{font-size:11px;}
  #btDodge{background:linear-gradient(180deg,#3a6ea5,#274b72);border:1px solid #6ea8d8;color:#fff;border-radius:12px;padding:10px 20px;font-size:17px;font-weight:800;letter-spacing:2px;cursor:pointer;font-family:inherit;}
  #btDodge:hover{filter:brightness(1.2);}
  #btDodge:disabled{opacity:.4;cursor:not-allowed;}
  .fighter.flash{animation:fs .4s;}
  @keyframes fs{0%,100%{transform:translateX(0);}30%{transform:translateX(-12px);}60%{transform:translateX(10px);}}
  /* 移动端适配 */
  *{touch-action:manipulation;}
  @media (max-width:700px){
    body{padding:0;}
    #game{border-radius:0;border-left:none;border-right:none;width:100%;}
    #topbar{flex-wrap:wrap;gap:6px;padding:8px 10px;}
    #logo{font-size:15px;letter-spacing:0;}
    #roomName{font-size:12px;}
    #treasureCount{font-size:12px;}
    .topbtn{padding:7px 9px;font-size:13px;}
    .navbtn{width:48px;height:72px;font-size:26px;border-radius:12px;}
    .navbtn.up,.navbtn.down{width:72px;height:42px;}
    #msg{bottom:84px;font-size:13px;max-width:94%;}
    #invBar{padding:8px 10px;}
    .slot{width:60px;height:60px;}
    .slot .ico img{width:40px;height:40px;}
    .startInner{grid-template-columns:1fr;gap:16px;text-align:center;}
    .startTitle{text-align:center;}
    .startTitle .stBig{font-size:38px;letter-spacing:6px;}
    .startTitle .stTag{margin-top:10px;}
    .startVs{gap:6px;}
    .charCard .ph{width:132px;height:172px;}
    .vsMark{font-size:34px;}
    .startBtn{font-size:16px;padding:13px 16px;}
    #battle{gap:12px;padding:14px;}
    .btTop{font-size:22px;letter-spacing:3px;}
    .btStage{gap:14px;}
    .fighter{width:132px;}
    .fighter .fimg{width:130px;height:180px;}
    .fname{font-size:14px;}
    .btVs{font-size:30px;}
    #btLog{font-size:13px;min-height:50px;}
    .btItem img{width:38px;height:38px;}
    #btDodge{padding:12px 16px;font-size:15px;}
    .card{padding:20px 16px;}
    .codeSlot{width:54px;height:62px;font-size:30px;}
    .key{height:56px;font-size:20px;}
    #dogChaser img{width:160px;height:300px;}
    #chaseBar{font-size:13px;gap:8px;padding:7px 12px;top:8px;border-radius:10px;}
    #chaseTimer{font-size:22px;min-width:24px;}
    .mixSlot{width:60px;height:60px;font-size:12px;}
    .mixSlot.filled{font-size:28px;}
  }
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <span id="logo">🐕 黄博妙妙屋</span>
    <span id="roomName"></span>
    <span id="treasureCount">秘宝 0 / 7</span>
    <button class="topbtn" id="hintBtn" title="提示">💡 提示</button>
    <button class="topbtn" id="soundBtn" title="声音开关">🔊</button>
    <button class="topbtn" id="musicBtn" title="音乐开关">🎵</button>
    <button class="topbtn" id="thiefBtn" title="化身小偷博" style="display:none">🥷 化身小偷博</button>
  </div>

  <div id="sceneWrap">
    <svg id="scene" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
    <div id="msg"></div>
    <div id="dogOverlay">
      <div id="dogFlash"></div>
      <div class="bolt bl">⚡</div>
      <div class="bolt br">⚡</div>
      <div class="bolt bc">⚡</div>
      <div id="dogChaser"><img src="images/dog.png" alt="闪电狗"></div>
    </div>
    <div id="chaseBar">
      <span>⚡ 闪电狗追来了！</span>
      <span>快躲进厨房冰箱！</span>
      <span id="chaseTimer">16</span>
    </div>
  </div>

  <div id="invBar">
    <span id="invLabel">背包</span>
    <div id="invSlots" style="display:flex;gap:8px;flex-wrap:wrap;flex:1;"></div>
  </div>
</div>

<div id="modal"></div>

<div id="startScreen">
  <div class="startInner">
    <div class="startTitle">
      <div class="stBig">黄博</div>
      <div class="stBig">妙妙屋</div>
      <div class="stTag">手绘解谜 · BOBO 秘宝</div>
    </div>
    <div class="startVs">
      <div class="charCard bob">
        <div class="ph"><img src="images/huangbo.jpg" alt="黄博"></div>
        <span>黄博</span>
      </div>
      <div class="vsMark">⚡</div>
      <div class="charCard dog">
        <div class="ph"><img src="images/dog.png" alt="闪电狗"></div>
        <span>闪电狗</span>
      </div>
    </div>
    <div class="startMenu">
      <button class="startBtn gold" onclick="startGame()">开始游戏</button>
      <button class="startBtn" id="continueBtn" onclick="continueGame()">继续游戏</button>
      <button class="startBtn" onclick="showHelp()">操作说明</button>
    </div>
  </div>
</div>

<div id="battle">
  <div class="btTop" id="btTitle">⚔ 最终身法战</div>
  <div class="btStage">
    <div class="fighter" id="fBob">
      <div class="fimg"><img src="images/huangbo-agile.png" alt="黄博"></div>
      <div class="fname">黄博</div>
      <div class="hpbar"><div id="bobHp" class="hpfill"></div></div>
      <div class="hptxt" id="bobHpTxt">100 / 100</div>
    </div>
    <div class="btVs" id="btVs">⚡</div>
    <div class="fighter dog" id="fEnemy">
      <div class="fimg" id="enemyImg"><img src="images/dog.png" alt="闪电狗"></div>
      <div class="fname" id="enemyName">闪电狗</div>
      <div class="hpbar"><div id="enemyHp" class="hpfill dog"></div></div>
      <div class="hptxt" id="enemyHpTxt">120 / 120</div>
    </div>

/* ---------------- 存档 / 续玩 ---------------- */
const SAVE_KEY = "hbmww_save_v1";
function saveGame(){
  if(state.over) return;
  try{
    const data = {
      room: state.room,
      inventory: Array.from(state.inventory),
      placed: Array.from(state.placed),
      stolen: state.stolen.slice(),
      flags: state.flags,
      bookSeq: state.bookSeq,
      gotManual: state.gotManual,
      dogDefeated: state.dogDefeated,
      muted: state.muted,
      musicOn: state.musicOn,
      thiefMode: state.thiefMode
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function hasSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}
function loadGame(){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return false; }
  if(!data) return false;
  state.room = data.room || "living";
  state.inventory = new Set(data.inventory || []);
  state.placed = new Set(data.placed || []);
  state.stolen = (data.stolen || []).slice();
  state.flags = Object.assign({}, data.flags);
  state.bookSeq = data.bookSeq || 0;
  state.gotManual = !!data.gotManual;
  state.dogDefeated = !!data.dogDefeated;
  state.over = false;
  state.muted = !!data.muted;
  state.musicOn = data.musicOn !== false;
  state.thiefMode = !!data.thiefMode;

  state.dogChasing = false;

  document.getElementById("musicBtn").textContent = state.musicOn ? "🎵" : "🔕";
  if(state.flags.posterCut) ROOMS.study.nav.up = "secret";
  hideStartScreen();
  go(state.room);
  msg("继续游戏，欢迎回来！");
  startBgm();
  if(state.gotManual && !state.dogDefeated){ startFinalShowdown(); }
  else { scheduleDog(); }
  return true;
}

/* ---------------- 音效（Web Audio 简单合成） ---------------- */
let actx = null;
function beep(freq, dur, type, vol){
  if(state.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.value = vol||0.08;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.08, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sfx = {
  pick:()=>{beep(660,.1,"triangle");beep(880,.14,"triangle");},
  use:()=>{beep(440,.12,"square");beep(330,.16,"square");},
  err:()=>{beep(180,.18,"sawtooth");},
  open:()=>{beep(520,.08,"triangle");beep(700,.1,"triangle");beep(940,.12,"triangle");},
  zap:()=>{beep(120,.4,"sawtooth",.18);beep(80,.5,"sawtooth",.14);},
  warn:()=>{beep(220,.3,"square",.12);beep(220,.3,"square",.12);},
  win:()=>{[660,880,1100,1320].forEach((f,i)=>beep(f,.22,"triangle",.1));}
};

/* ---------------- 背景音乐（Web Audio 简单合成循环） ---------------- */
let bgmTimer = null, bgmStep = 0;
const BGM_SEQ = [220.00, 261.63, 329.63, 392.00, 329.63, 293.66, 261.63, 246.94, 196.00, 246.94, 293.66, 329.63];
function playBgmStep(){
  if(!state.musicOn || state.muted) return;
  const f = BGM_SEQ[bgmStep % BGM_SEQ.length];
  beep(f, .55, "triangle", .026);
  beep(f*2, .45, "sine", .012);
  bgmStep++;
}
function startBgm(){
  stopBgm();
  playBgmStep();
  bgmTimer = setInterval(playBgmStep, 460);
}
function stopBgm(){
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
}
/* 突袭警报音（紧张急促） */
let alarmTimer = null, alarmStep = 0;
function startAlarm(){
  stopAlarm();
  alarmStep = 0;
  alarmTimer = setInterval(()=>{
    if(state.muted) return;
    const f = alarmStep % 2 === 0 ? 920 : 700;
    beep(f, .09, "square", .1);
    if(alarmStep % 4 === 0) beep(160, .12, "sawtooth", .12);
    alarmStep++;
  }, 170);
}
function stopAlarm(){
  if(alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; }
}

/* ---------------- 消息提示 ---------------- */
let msgTimer = null;
function msg(text, cls){
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "show" + (cls ? " " + cls : "");
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>{ el.className = ""; }, 3400);
}

function invList(){
  return Array.from(state.inventory);

function updateInventory(){
  const wrap = document.getElementById("invSlots");
  const items = invList();
  wrap.innerHTML = "";
  if(items.length === 0){
    const e = document.createElement("div");
    e.className = "slot empty";
    e.innerHTML = '<span class="ico">·</span><span class="nm">空空如也</span>';
    wrap.appendChild(e);
  }
  items.forEach(id=>{
    const it = ITEMS[id];
    const s = document.createElement("div");
    s.className = "slot" + (state.selected === id ? " selected" : "") + (it.treasure ? " treasure" : "");
    s.innerHTML = (it.img
      ? '<span class="ico"><img src="'+it.img+'" alt="'+it.name+'"></span>'
      : '<span class="ico">'+it.icon+'</span>')
      + '<span class="nm">'+it.name+'</span>';
    s.title = it.name;
    s.onclick = ()=>{
      if(state.selected === id){ state.selected = null; }
      else { state.selected = id; sfx.pick(); msg("选中了「"+it.name+"」，点击场景使用或再次点击取消。"); }
      updateInventory();
    };
    wrap.appendChild(s);
  });
  updateTreasureCount();
  updateThiefUI();
}
function updateTreasureCount(){
  const have = SIX.filter(t=>state.inventory.has(t)||state.placed.has(t)).length

/* =====================================================================
 *  渲染
 * ===================================================================== */
const scene = document.getElementById("scene");
function playerSvg(){
  const src = state.gotManual ? "images/huangbo-agile.png" : "images/huangbo.jpg";
  const thief = state.thiefMode ? `<text class="obj" x="480" y="366" font-size="30" text-anchor="middle">🥷</text>` : '';
  return `
    <ellipse cx="480" cy="521" rx="56" ry="13" fill="#000" opacity=".35"/>
    ${thief}
    <image class="player" href="${src}" xlink:href="${src}" x="425" y="372" width="110" height="148" preserveAspectRatio="xMidYMax meet"/>`;
}
function renderRoom(){
  const r = ROOMS[state.room];
  document.getElementById("roomName").textContent = "· " + r.name;
  scene.innerHTML = HD_DEFS + '<g filter="url(#hd)">' + r.svg + '</g>' + '<rect x="0" y="0" width="960" height="560" fill="url(#vignette)" pointer-events="none"/>' + playerSvg();
  // 祭坛凹槽
  if(state.room === "secret"){
    const slots = document.getElementById("altarSlots");
    if(slots){
      const sx = [330,400,470,540,610,680];
      SIX.forEach((t,i)=>{
        const filled = state.placed.has(t);
        slots.innerHTML += `
          <circle cx="${sx[i]}" cy="388" r="20" fill="${filled ? '#1d1510' : '#2a1f17'}" stroke="#8a6a48" stroke-width="3"/>
          <text x="${sx[i]}" y="394" font-size="20" text-anchor="middle" fill="#e9ddc7">${filled ? ITEMS[t].icon : "·"}</text>`;
      });
    }
  }
  // 狗窝可见性
  const dh = scene.querySelector('[data-hs="doghouse"]');
  if(dh) dh.style.display = state.stolen.length > 0 ? "" : "none";
  // 导航按钮
  renderNav(r.nav);
}
function renderNav(nav){
  // 清理旧导航按钮
  document.querySelectorAll(".navbtn").forEach(n=>n.remove());
  const wrap = document.getElementById("sceneWrap");
  const defs = [
    ["left","←", "left"],["right","→","right"],["up","↑","up"],["down","↓","down"]
  ];
  defs.forEach(([dir,label,cls])=>{
    const target = nav[dir];
    if(!target) return;
    const b = document.createElement("button");
    b.className = "navbtn " + cls;
    b.textContent = label;
    b.title = "前往 " + ROOMS[target].name;
    b.onclick = ()=>go(target);
    wrap.appendChild(b);
  });
}
function go(room){
  state.room = room;
  state.selected = null;
  updateInventory();
  renderRoom();
  saveGame();
}

/* =====================================================================
 *  热点处理
 * ===================================================================== */
scene.addEventListener("click", e=>{
  const g = e.target.closest("[data-hs]");
  if(!g) return;
  const id = g.getAttribute("data-hs");
  if(state.dogChasing){
    if(id === "fridge"){ hideInFridge(); }
    else { msg("⚡ 闪电狗追上来了！快躲进厨房的冰箱！","warn"); }
    return;
  }
  if(state.dogBusy) return;
  handleHotspot(id, state.selected);
});

function handleHotspot(id, item){
  const f = state.flags;
  switch(id){

    /* ---------- 客厅 ---------- */
    case "coat":
      if(!state.inventory.has("scissors") && !state.placed.has("scissors")){
        give("scissors"); msg("你从衣架上取下了「折叠剪刀」！✂️","good");
      } else if(state.placed.has("scissors")){
        msg("衣架上空空如也。");
      } else msg("衣架上的衣服已经被翻过了。");
      break;

    case "sofa":
      if(item === "scissors" && !f.sofaCut){
        f.sofaCut = true; sfx.use();
        give("key");
        msg("你用剪刀剪开沙发的线头，掉出一把「钥匙」！🔑","good");
      } else if(item === "scissors" && f.sofaCut){
        msg("沙发里已经没有东西了。");
      } else if(!f.sofaCut && !item){
        msg("沙发上有一根松动的线头，也许能用「折叠剪刀」剪开。");
      } else if(!f.sofaCut && item && item !== "scissors"){
        msg("这东西对沙发线头没什么用。");
      } else msg("沙发里已经没有东西了。");
      break;

    case "tv":
      msg("电视新闻：「⚠️ 妙妙屋闪电狗出没，遇袭请立刻躲进厨房冰箱！」");
      break;

    case "painting":
      msg("挂画上画着妙妙屋的平面图，书房那幅海报的后面似乎另有乾坤。");
      break;

    case "doghouse":
      if(state.stolen.length){
        const back = state.stolen.splice(0);
        back.forEach(t=>state.inventory.add(t));
        sfx.open();
        msg("你在狗窝里找回了被抢走的秘宝！" + back.map(t=>ITEMS[t].name).join("、"),"good");
        updateInventory(); renderRoom();
      } else msg("狗窝空空的。");
      break;

    case "door":
      if(state.gotManual && state.dogDefeated){ winGame(); }
      else if(state.gotManual) msg("你已学会身法，但闪电狗还挡在门口！先去打败它。");
      else msg("大门被一股神秘力量锁住了，只有学会「身法秘籍」才能打开。");
      break;

    /* ---------- 厨房 ---------- */
    case "shelf":
      if(item === "broom" && !f.shelfKnocked){
        f.shelfKnocked = true; sfx.use();
        give("redbone");
        msg("你用扫把把「红烤骨」拨了下来！🦴","good");
      } else if(item === "broom" && f.shelfKnocked){
        msg("架子上已经没有东西了。");
      } else if(!item){
        msg("架子太高了，够不到。也许需要一根长一点的工具。");
      } else if(item && item !== "broom"){
        msg("还是够不到，太短了。");
      } else msg("架子上已经没有东西了。");
      break;

    case "cabinet":
      if(f.moneyStolen){ msg("柜子里已经空了，19.9 被偷走了。"); }
      else if(!state.thiefMode){ msg("柜门锁得死死的，还连着警报——得化身「小偷博」才敢动手。"); }
      else {
        f.moneyStolen = true; sfx.use();
        give("money");
        msg("小偷博出手！你从柜子里偷出了「19.9元」！💰","good");
      }
      break;

    case "fridge":
      msg("冰箱里空空如也，只有一股寒气。不过躲进去倒是挺安全。");
      break;

    /* ---------- 卧室 ---------- */
    case "broomspot":
      if(!state.inventory.has("broom")){
        give("broom"); msg("你捡起了角落里的「扫把」！🧹","good");
      } else msg("角落里已经没有扫把了。");
      break;

    case "wardrobe":
      if(item === "key" && !f.wardrobeOpen){
        f.wardrobeOpen = true; sfx.open();
        give("flashlight");
        msg("你用钥匙打开衣柜，拿到了「手电筒」！🔦","good");
      } else if(item === "key" && f.wardrobeOpen){
        msg("衣柜里已经没有东西了。");
      } else if(!f.wardrobeOpen && !item){
        msg("衣柜锁着，需要一把「钥匙」。");
      } else if(!f.wardrobeOpen && item && item !== "key"){
        msg("这把锁需要「钥匙」。");
      } else msg("衣柜里已经没有东西了。");
      break;

    case "bed":
      if(item === "flashlight" && !f.bedLooked){
        f.bedLooked = true; sfx.use();
        give("foot");
        msg("手电筒照向床底，你摸到了一个奇怪的「脚儿巴」！🦶","good");
      } else if(item === "flashlight" && f.bedLooked){
        msg("床底已经看过了，什么也没有。");
      } else if(!item){
        msg("床底黑漆漆的，什么也看不见。也许需要照亮它。");
      } else if(item && item !== "flashlight"){
        msg("床底太黑了，你需要光线。");
      } else msg("床底已经看过了，什么也没有。");
      break;

    /* ---------- 书房 ---------- */
    case "desk":
      if(!f.noteRead){
        f.noteRead = true; sfx.open();
        give("goldliq");
        msg("抽屉里有张纸条：「积液配方：口水 → 金液 → 红烤骨」和一小管「金液」！✨","good");
      } else msg("抽屉里只剩那张写着积液配方的纸条。");
      break;

    case "bookGuide":
      msg("《BOBO秘宝图鉴》记载：红、蓝、绿、黄，依次点亮书架。");
      break;

    case "bookRed": bookClick("red"); break;
    case "bookBlue": bookClick("blue"); break;
    case "bookGreen": bookClick("green"); break;
    case "bookYellow": bookClick("yellow"); break;

    case "poster":
      if(item === "batknife" && !f.posterCut){
        f.posterCut = true; sfx.open();
        msg("你用「蝙蝠刀」割开海报，露出一扇向上的暗门！","good");
        renderNav(ROOMS[state.room].nav);
        // 解锁密室导航
        ROOMS.study.nav.up = "secret";
        renderNav(ROOMS.study.nav);
      } else if(item === "batknife" && f.posterCut){
        msg("海报已经被割开了。");
      } else if(!f.posterCut && !item){
        msg("海报后面似乎藏着什么，但需要锋利的工具割开。");
      } else if(!f.posterCut && item && item !== "batknife"){
        msg("割不开，需要更锋利的工具。");
      } else msg("海报已经被割开了。");
      break;

    /* ---------- 密室 ---------- */
    case "cage":
      if(item === "blackhand" && !f.cageOpen){
        f.cageOpen = true; sfx.open();
        give("bailing");
        msg("你用「黑手残骸」撬开鸟笼，「百灵仙」振翅飞出，落在你肩头！🐦","good");
        renderRoom();
      } else if(item === "blackhand" && f.cageOpen){
        msg("鸟笼已经空了。");
      } else if(!f.cageOpen && !item){
        msg("鸟笼的锁被一股黑气缠绕，只有「黑手残骸」才能解开。");
      } else if(!f.cageOpen && item && item !== "blackhand"){
        msg("这锁需要「黑手残骸」才能解开。");
      } else msg("鸟笼已经空了。");
      break;

    case "altar":
      if(state.gotManual){ msg("祭坛上方悬浮着「身法秘籍」的灵光，你已获得身法。"); break; }
      {
        const haveAll = SIX.every(t=>state.inventory.has(t));
        if(haveAll){
          SIX.forEach(t=>{ state.inventory.delete(t); state.placed.add(t); });
          sfx.win();
          give("manual");
          state.gotManual = true;
          updateInventory(); renderRoom();
          msg("六件秘宝归位，祭坛迸发光芒，你获得了「身法秘籍」！📜","good");
          setTimeout(startFinalShowdown, 1800);
        } else {
          const missing = SIX.filter(t=>!state.inventory.has(t));
          const gotList = SIX.filter(t=>state.inventory.has(t)||state.placed.has(t));
          msg("石台有六个凹槽，需集齐六件秘宝。已获 " + gotList.length + " 件：" +
              (gotList.length?gotList.map(t=>ITEMS[t].name).join("、"):"无") +
              (missing.length?"；还缺："+missing.map(t=>ITEMS[t].name).join("、"):""));
        }
      }
      break;

    /* ---------- 厕所 ---------- */
    case "sink":
      if(!f.salivaGot){
        f.salivaGot = true; sfx.use();
        give("saliva");
        msg("你接了一杯自来水当作「口水」原料！💧","good");
      } else msg("水龙头已经接过了。");
      break;

    case "mirror":
      if(f.blackhandDead){ msg("镜子恢复了平静，里面只剩你的倒影。"); }
      else { openBattle("blackhand"); }
      break;

    case "towel":
      if(!state.inventory.has("thief")){
        give("thief");
        msg("你从毛巾架上取下了「小偷博套装」！🥷","good");
      } else msg("毛巾架上只剩一条普通毛巾了。");
      break;

    /* ---------- 厨房（配制积液） ---------- */
    case "mixbench":
      if(state.inventory.has("bottle") || state.placed.has("bottle")){
        msg("配制台已经完成了它的使命。");
      } else openMixWindow();
      break;

    /* ---------- 客厅（东川商贩） ---------- */
    case "merchant":
      if(f.betelBought){ msg("东川商贩已经收摊了，只留下一串神秘的笑声。"); }
      else if(item === "money"){
        f.betelBought = true; sfx.open();
        state.inventory.delete("money");
        give("betel");
        msg("你用 19.9 元从东川商贩手里换到了「和成天下槟榔」！🥜","good");
      } else if(!item){
        msg("东川神秘商贩低声说：「和成天下槟榔，一包只要 19.9……现金交易。」");
      } else if(item && item !== "money"){
        msg("商贩摆摆手：「我只要 19.9 元现金。」");
      } else msg("东川商贩已经收摊了。");
      break;

    default:
      msg("……");
  }
  saveGame();
}

function bookClick(color){
  if(state.flags.booksSolved){ msg("书架已经打开了。"); return; }
  if(color === BOOK_ORDER[state.bookSeq]){
    state.bookSeq++;
    if(state.bookSeq === BOOK_ORDER.length){
      state.flags.booksSolved = true;
      sfx.open();
      give("batknife");
      msg("顺序正确！书架滑开，露出「蝙蝠刀」！🦇","good");
    } else {
      sfx.pick();
      msg("第 " + state.bookSeq + " 本……");
    }
  } else {
    state.bookSeq = 0;
    sfx.err();
    msg("顺序不对，书架重新锁上了。");
  }
  saveGame();

const MIX_ORDER = ["saliva","goldliq","redbone"];
let mixOrder = [];
function openMixWindow(){
  mixOrder = [];
  const m = document.getElementById("modal");
  m.innerHTML = `
    <div class="card">
      <h2>🧪 配制积液</h2>
      <p>按配方顺序投入原料：<strong style="color:#f0c060">口水 → 金液 → 红烤骨</strong></p>
      <div class="mixSlots" id="mixSlots">
        <div class="mixSlot">1</div><div class="mixSlot">2</div><div class="mixSlot">3</div>
      </div>
      <div class="mixIng" id="mixIng"></div>
      <div class="hint" id="mixHint"></div>
      <div class="row"><button class="bigbtn" onclick="closeModal()">关闭</button></div>
    </div>`;
  m.classList.add("open");
  renderMixSlots();
  renderMixIng();
}
function renderMixSlots(){
  const slots = document.querySelectorAll("#mixSlots .mixSlot");
  slots.forEach((s,i)=>{
    const id = mixOrder[i];
    if(id){ s.textContent = ITEMS[id].icon; s.classList.add("filled"); }
    else { s.textContent = (i+1); s.classList.remove("filled"); }
  });
}
function renderMixIng(){
  const wrap = document.getElementById("mixIng");
  if(!wrap) return;
  wrap.innerHTML = "";
  MIX_ORDER.forEach(id=>{
    const used = mixOrder.includes(id);
    const have = state.inventory.has(id);
    const b = document.createElement("button");
    b.className = "mixIngBtn";
    b.innerHTML = ITEMS[id].icon + " " + ITEMS[id].name;
    b.disabled = used || !have;
    b.onclick = ()=>addMixIngredient(id);
    wrap.appendChild(b);
  });
}
function addMixIngredient(id){
  if(mixOrder.length >= 3) return;
  mixOrder.push(id);
  sfx.pick();
  renderMixSlots();
  if(mixOrder.length === 3){
    if(mixOrder.join(",") === MIX_ORDER.join(",")){
      sfx.win();
      closeModal();
      MIX_ORDER.forEach(t=>state.inventory.delete(t));
      give("bottle");
      msg("🎉 配制成功！你得到了「积液瓶」！🧪","good");
    } else {
      sfx.err();
      document.getElementById("mixHint").textContent = "配错了！原料顺序不对，重新来。";
      mixOrder = [];
      renderMixSlots();
      renderMixIng();
    }
  } else {
    renderMixIng();
  }
}

/* =====================================================================
 *  闪电狗机制
 * ===================================================================== */
let dogTimeout = null, dogCountdown = null;
const NORMAL_DODGE_MS = 5000;

function scheduleDog(short){
  if(state.over || state.gotManual || state.dogDefeated) return;
  clearTimeout(dogTimeout);
  let delay;
  if(short){ delay = 4000 + Math.random()*4000; }                       // 追击后短重试 4-8s
  else { delay = state.flags.firstDog ? (26000 + Math.random()*22000) : 16000; }
  dogTimeout = setTimeout(()=>{
    if(state.over || state.gotManual || state.dogDefeated) return;
    state.flags.firstDog = true;
    dogAttack();
  }, delay);
}

function dogAttack(){
  if(state.over) return;
  if(state.dogBusy){ scheduleDog(true); return; }   // 正忙（战斗/追击）时稍后重试，避免狗永久消失
  state.dogBusy = true;
  state.dogChasing = true;
  closeModal();
  const overlay = document.getElementById("dogOverlay");
  const chaseBar = document.getElementById("chaseBar");
  const chaseTimer = document.getElementById("chaseTimer");
  overlay.classList.add("show");
  chaseBar.classList.add("show");
  startAlarm();
  sfx.warn();
  document.getElementById("sceneWrap").classList.add("shake");
  msg("⚡ 闪电狗追来了！快躲进厨房的冰箱！","warn");

  let left = 16;
  chaseTimer.textContent = left;
  clearInterval(dogCountdown);
  dogCountdown = setInterval(()=>{
    left--;
    if(left <= 0){
      clearInterval(dogCountdown);
      dogZap();
    } else {
      chaseTimer.textContent = left;
      beep(300,.08,"square",.08);
    }
  }, 1000);
}

function hideInFridge(){
  if(!state.dogChasing) return;
  clearInterval(dogCountdown);
  stopAlarm();
  state.dogChasing = false;
  state.dogBusy = false;
  document.getElementById("dogOverlay").classList.remove("show");
  document.getElementById("chaseBar").classList.remove("show");
  document.getElementById("sceneWrap").classList.remove("shake");
  sfx.open();
  msg("你一个箭步钻进冰箱，闪电狗在外面转了几圈，悻悻离去。好险！","good");
  saveGame();
  scheduleDog(true);
}

function dogZap(){
  const overlay = document.getElementById("dogOverlay");
  const chaseBar = document.getElementById("chaseBar");
  const wrap = document.getElementById("sceneWrap");
  overlay.classList.remove("show");
  chaseBar.classList.remove("show");
  stopAlarm();
  clearInterval(dogCountdown);
  state.dogChasing = false;
  wrap.classList.remove("shake");
  wrap.classList.add("flash");
  setTimeout(()=>wrap.classList.remove("flash"), 400);
  sfx.zap();
  state.dogBusy = false;

  const stealable = SIX.filter(t=>state.inventory.has(t));
  if(stealable.length){
    const n = (stealable.length >= 5) ? Math.min(2, stealable.length) : 1;
    const victims = stealable.slice().sort(()=>Math.random()-0.5).slice(0, n);
    victims.forEach(v=>{ state.inventory.delete(v); state.stolen.push(v); });
    updateInventory(); renderRoom();
    msg("⚡ 闪电狗扑倒了你，抢走了「"+victims.map(v=>ITEMS[v].name).join("、")+"」！去客厅的狗窝找回来吧。","warn");
  } else {
    msg("⚡ 闪电狗扑了个空——你身上没有可抢的秘宝，暂时安全。","warn");
  }
  saveGame();
  scheduleDog(true);
}

/* =====================================================================
 *  战斗界面（闪电狗 / 黑手）
 * ===================================================================== */
const BATTLE_DMG = {
  scissors:16, bottle:20, betel:12, foot:15,
  batknife:28, bailing:34, broom:9, key:6, flashlight:11, fist:8
};
const ENEMIES = {
  dog:       {name:"闪电狗", hp:120, dmg:18, img:"images/dog.png", icon:"🐕"},
  blackhand: {name:"黑手",   hp:70,  dmg:12, img:null,             icon:"🖐️"}
};
let battle = null;

function battleWeapons(){
  const w = [], seen = new Set();
  const add = t=>{ if(!seen.has(t)){ seen.add(t); w.push(t); } };
  SIX.forEach(t=>{ if(state.placed.has(t) || state.inventory.has(t)) add(t); });
  ["broom","key","flashlight","scissors"].forEach(t=>{ if(state.inventory.has(t)) add(t); });
  add("fist");
  return w;
}
function openBattle(enemyId){
  state.dogBusy = true;
  stopAlarm(); stopBgm();
  const E = ENEMIES[enemyId];
  battle = { enemyId, enemyHp:E.hp, enemyMax:E.hp, bobHp:100, bobMax:100, phase:"player", dodging:false, enemyTimer:null };
  document.getElementById("btTitle").textContent = enemyId === "dog" ? "⚔ 最终身法战" : "⚔ 厕所黑手搏斗";
  document.getElementById("btVs").textContent = E.icon;
  document.getElementById("enemyName").textContent = E.name;
  document.getElementById("enemyImg").innerHTML = E.img
    ? '<img src="'+E.img+'" alt="'+E.name+'">'
    : '<span style="font-size:56px">'+E.icon+'</span>';
  document.getElementById("battle").classList.add("show");
  const wrap = document.getElementById("btItems");
  wrap.innerHTML = "";
  battleWeapons().forEach(id=>{
    const it = ITEMS[id];
    const btn = document.createElement("button");
    btn.className = "btItem";
    btn.innerHTML = (it.img ? '<img src="'+it.img+'" alt="">' : '<span style="font-size:22px">'+it.icon+'</span>') + '<span>'+it.name+'</span>';
    btn.onclick = ()=>btAttack(id);
    wrap.appendChild(btn);
  });
  const dodge = document.getElementById("btDodge");
  dodge.disabled = true;
  dodge.onclick = btDodge;
  document.getElementById("btLog").innerHTML = "";
  updateBattleHp();
  btLog(enemyId === "dog"
    ? "⚔ 最终身法战！点击道具攻击闪电狗，它反击时点「闪避」躲开！"
    : "⚔ 一只黑手从镜子里钻了出来！点击道具攻击它，看准时机闪避！");
}
function updateBattleHp(){
  if(!battle) return;
  document.getElementById("bobHp").style.width = Math.round(battle.bobHp/battle.bobMax*100)+"%";
  document.getElementById("enemyHp").style.width = Math.round(battle.enemyHp/battle.enemyMax*100)+"%";
  document.getElementById("bobHpTxt").textContent = battle.bobHp+" / "+battle.bobMax;
  document.getElementById("enemyHpTxt").textContent = battle.enemyHp+" / "+battle.enemyMax;
}
function btLog(text, cls){
  const el = document.getElementById("btLog");
  const d = document.createElement("div");
  d.textContent = text;
  if(cls === "good") d.style.color = "#d8ffd8";
  else if(cls === "warn") d.style.color = "#ffd9d0";
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function flashFighter(id){
  const el = document.getElementById(id);
  if(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
function btAttack(id){
  if(!battle || battle.phase !== "player") return;
  const dmg = BATTLE_DMG[id] || 8;
  battle.enemyHp = Math.max(0, battle.enemyHp - dmg);
  sfx.use();
  flashFighter("fEnemy");
  btLog("你用「"+ITEMS[id].name+"」对"+ENEMIES[battle.enemyId].name+"造成 "+dmg+" 点伤害！");
  updateBattleHp();
  if(battle.enemyHp <= 0){ winBattle(); return; }
  battle.phase = "enemy";
  battle.dodging = false;
  document.getElementById("btDodge").disabled = false;
  btLog(ENEMIES[battle.enemyId].name+"要反击了——快点「闪避」！","warn");
  battle.enemyTimer = setTimeout(btEnemyAttack, 1300);
}
function btDodge(){
  if(!battle || battle.phase !== "enemy" || battle.dodging) return;
  battle.dodging = true;
  document.getElementById("btDodge").disabled = true;
  sfx.pick();
  btLog("你凝神闪避，准备躲开攻击！","good");
}
function btEnemyAttack(){
  if(!battle) return;
  if(battle.dodging){
    sfx.pick();
    btLog("好险！你灵巧地躲开了攻击！","good");
  } else {
    const dmg = ENEMIES[battle.enemyId].dmg;
    battle.bobHp = Math.max(0, battle.bobHp - dmg);
    sfx.zap();
    flashFighter("fBob");
    btLog(ENEMIES[battle.enemyId].name+"击中了你，损失 "+dmg+" 点生命！","warn");
  }
  updateBattleHp();
  if(battle.bobHp <= 0){ loseBattle(); return; }
  battle.phase = "player";
  document.getElementById("btDodge").disabled = true;
}
function winBattle(){
  const enemyId = battle.enemyId;
  state.dogBusy = false;
  sfx.win();
  if(battle && battle.enemyTimer) clearTimeout(battle.enemyTimer);
  document.getElementById("battle").classList.remove("show");
  battle = null;
  if(enemyId === "dog"){
    state.dogDefeated = true;
    updateTreasureCount();
    saveGame();
    msg("🎉 你打败了闪电狗！去客厅的大门逃出升天吧！","good");
    startBgm();
  } else {
    state.flags.blackhandDead = true;
    give("blackhand");
    msg("你打败了黑手，捡起了「黑手残骸」！🖐️","good");
    startBgm();
    scheduleDog(true);
  }
}
function loseBattle(){
  const enemyId = battle.enemyId;
  sfx.err();
  if(battle && battle.enemyTimer) clearTimeout(battle.enemyTimer);
  document.getElementById("battle").classList.remove("show");
  battle = null;
  state.dogBusy = false;
  if(enemyId === "dog"){
    msg("你被闪电狗击倒了！重整旗鼓，再战！","warn");
    setTimeout(()=>openBattle("dog"), 900);
  } else {
    msg("你被黑手打出了厕所！缓一缓再进去挑战。","warn");
    startBgm();
    scheduleDog(true);
  }
}

document.getElementById("thiefBtn").onclick = function(){
  if(!state.inventory.has("thief")) return;
  state.thiefMode = !state.thiefMode;
  sfx.pick();
  msg(state.thiefMode ? "你化身「小偷博」！🥷 去厨房的柜子偷 19.9 吧。" : "你脱下了小偷博套装，变回普通黄博。");
  updateThiefUI();
  renderRoom();
  saveGame();
};

/* 初始渲染 */
showStartScreen();
updateInventory();
renderRoom();
</script>
</body>
</html>
